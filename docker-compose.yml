# Local testing only. Production runs on the host's web server (see deploy.md).
name: logger

services:

  logger_php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: logger_php
    ports:
      - "${PORT:-3002}:80"
    volumes:
      - ./:/var/www/logger
    env_file: .env
    depends_on:
      - logger_db
    restart: unless-stopped

  logger_db:
    image: mariadb:11
    container_name: logger_db
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - logger_db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  logger_db_data:
