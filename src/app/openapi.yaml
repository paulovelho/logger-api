openapi: 3.0.3
info:
  title: Logger API
  description: |
    Flexible logging microservice for the **guia.lol** project.
    Services authenticate via JWT and log arbitrary JSON data, each isolated to their own logs.

    **Credentials** live in `config.json` (`service` + `secret`, plus optional `name`, `readonly`,
    `active`). The file is read on every request, so edits apply without a restart. The `service`
    is always taken from the JWT, never from the request body. Tokens never expire. Removing a
    service from `config.json` revokes its tokens.

    **Access levels**
    - any valid token: `/report`, `/errors`
    - *active* service (not `"active": false`): `POST /log`, `POST /error`, otherwise 403
    - *admin* credential (`"readonly": true`): every `/admin/*` route, otherwise 403

    **Envelope (since 1.2.0).** Every JSON response is `{success, data}`. Successes are HTTP 200.
    Errors carry the real HTTP status, with `data.message` and `data.code`.
  version: 1.2.1
servers:
  - url: /
    description: This instance
tags:
  - name: Auth
    description: Service authentication
  - name: Logs
    description: Log ingestion and querying (per-service)
  - name: Errors
    description: Error ingestion and querying (per-service)
  - name: Admin
    description: Cross-service access, admin (readonly) credential only
  - name: System
paths:
  /login:
    post:
      tags: [Auth]
      summary: Get a JWT token
      description: |
        Validates `service` + `secret` against `config.json` and returns a non-expiring HS256 JWT
        `{service, readonly, iat}`. `userId` is accepted in place of `service`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, secret]
              properties:
                service:
                  type: string
                  example: my-service
                secret:
                  type: string
                  example: s3cr3t
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /token:
    post:
      tags: [Auth]
      summary: Decode a token
      description: Verifies a token against this instance's key and returns its payload.
      operationId: decodeToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Decoded payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          decoded:
                            type: object
                            example: { service: my-service, readonly: false, iat: 1760000000 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /log:
    post:
      tags: [Logs]
      summary: Ingest a log entry
      description: |
        Stores the request body (minus `environment`) as the `data` of a new entry in `logger_logs`.
        Any JSON object is accepted (an empty body counts as `{}`). `service` comes from the JWT.
        `environment` is stored in its own column and defaults to `unknown`.
        Requires an active service.
      operationId: createLog
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payload'
            example:
              environment: production
              event: user.signup
              email: user@example.com
              meta:
                source: web
      responses:
        '200':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /report:
    get:
      tags: [Logs]
      summary: Query own logs
      description: The authenticated service's logs, newest first, with optional date range and pagination.
      operationId: getReport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/skip'
      responses:
        '200':
          $ref: '#/components/responses/LogList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /error:
    post:
      tags: [Errors]
      summary: Ingest an error entry
      description: |
        Same as `POST /log`, but stored in `logger_errors`. Requires an active service.
      operationId: createError
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payload'
            example:
              environment: production
              message: "Failed to fetch page"
              stack: "Error: ECONNREFUSED\n    at ..."
              url: "https://example.com/event/123"
      responses:
        '200':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /errors:
    get:
      tags: [Errors]
      summary: Query own errors
      description: The authenticated service's errors, newest first, with optional date range and pagination.
      operationId: getErrors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/skip'
      responses:
        '200':
          $ref: '#/components/responses/ErrorList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/logs:
    get:
      tags: [Admin]
      summary: Query logs across all services
      description: Same as `/report`, cross-service, with an optional `service` filter.
      operationId: adminLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/service'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/skip'
      responses:
        '200':
          $ref: '#/components/responses/LogList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Admin]
      summary: Purge one service's logs
      description: |
        Deletes the `service`'s logs older than `olderThanDays` days (default 365), then writes an
        audit entry into `logger_logs` under the reserved `service: "logger"`
        (`{action: "purge_logs", targetService, cutoffDays, deletedCount, performedBy}`).
      operationId: adminPurgeLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/purgeService'
        - $ref: '#/components/parameters/olderThanDays'
      responses:
        '200':
          $ref: '#/components/responses/Purged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/errors:
    get:
      tags: [Admin]
      summary: Query errors across all services
      description: Same as `/errors`, cross-service, with an optional `service` filter.
      operationId: adminErrors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/service'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/skip'
      responses:
        '200':
          $ref: '#/components/responses/ErrorList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Admin]
      summary: Purge one service's errors
      description: |
        Same as `DELETE /admin/logs`, on `logger_errors`. The audit entry (`action: "purge_errors"`)
        still goes into `logger_logs`.
      operationId: adminPurgeErrors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/purgeService'
        - $ref: '#/components/parameters/olderThanDays'
      responses:
        '200':
          $ref: '#/components/responses/Purged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/services:
    get:
      tags: [Admin]
      summary: Per-service summary
      description: |
        Every active service in `config.json` (including those with no logs), plus the synthetic
        `{service: "logger", name: "Logger (self)"}` that holds the purge audit trail. Counts and
        `lastLog` come from `logger_logs` only. Sorted by `lastLog`, newest first, never-logged last.
      operationId: adminServices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          services:
                            type: array
                            items:
                              type: object
                              properties:
                                service:
                                  type: string
                                  example: my-service
                                name:
                                  type: string
                                  example: My Service
                                count:
                                  type: integer
                                  example: 42
                                lastLog:
                                  type: string
                                  format: date-time
                                  nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /health-check:
    get:
      tags: [System]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is up (`database` is `ok` or `fail`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          health:
                            type: string
                            example: ok
                          database:
                            type: string
                            example: ok
                          time:
                            type: string
                            description: Server time, UTC
                            example: '2026-10-05 22:59:48'
  /version:
    get:
      tags: [System]
      summary: Release version
      operationId: getVersion
      responses:
        '200':
          description: Current version
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          version:
                            type: string
                            example: '1.2.1'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Obtain a token via `POST /login`. Tokens never expire.
  parameters:
    from:
      name: from
      in: query
      description: |
        Only entries at or after this date/time. Any format PHP's DateTimeImmutable parses
        (e.g. `2026-10-01`, `2026-10-01T12:00:00-03:00`); UTC unless an offset is given.
      schema:
        type: string
    to:
      name: to
      in: query
      description: |
        Only entries at or before this date/time (same formats as `from`). A bare date means its
        midnight, so `to=2026-10-01` excludes the rest of that day.
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Max entries to return (clamped to 1–1000)
      schema:
        type: integer
        default: 100
    skip:
      name: skip
      in: query
      description: Entries to skip (pagination offset, ≥ 0)
      schema:
        type: integer
        default: 0
    service:
      name: service
      in: query
      description: Only this service
      schema:
        type: string
    purgeService:
      name: service
      in: query
      required: true
      description: Service to purge
      schema:
        type: string
    olderThanDays:
      name: olderThanDays
      in: query
      description: Delete entries older than this many days (positive whole number)
      schema:
        type: integer
        minimum: 1
        default: 365
  schemas:
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          description: The route's payload
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          properties:
            message:
              type: string
              example: Invalid credentials
            code:
              type: integer
              example: 401
            type:
              type: string
              description: Vendor field (`exception`, or `unknown error` for an unknown route)
              example: exception
    Payload:
      type: object
      additionalProperties: true
      properties:
        environment:
          type: string
          maxLength: 50
          description: |
            Deployment environment (e.g. production, staging, development). A number is stored as
            its string; an empty string or any other type is a 400.
          default: unknown
          example: production
    Entry:
      type: object
      properties:
        _id:
          type: integer
          example: 42
        service:
          type: string
          example: my-service
        serviceName:
          type: string
          description: The service's `name` from config.json (its id if it has none)
          example: My Service
        environment:
          type: string
          example: production
        data:
          description: The JSON object the service posted, minus `environment`
          example:
            event: user.signup
            email: user@example.com
        timestamp:
          type: string
          format: date-time
          example: '2026-10-05T22:59:48.000Z'
  responses:
    Created:
      description: Entry stored
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42
                      timestamp:
                        type: string
                        format: date-time
    LogList:
      description: Matching logs
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Entries matching the filter (ignoring pagination)
                        example: 250
                      count:
                        type: integer
                        description: Entries in this response
                        example: 100
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/Entry'
    ErrorList:
      description: Matching errors
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 12
                      count:
                        type: integer
                        example: 12
                      errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/Entry'
    Purged:
      description: Purge result
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
                        example: 42
    BadRequest:
      description: Invalid body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token, a token for a service no longer in config.json, or bad credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Inactive service (writes) or not the admin (readonly) credential (`/admin/*`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: |
        Internal error. Unexpected failures (e.g. the database) carry a generic
        `Internal server error` message; the details go to the server log.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
