openapi: 3.0.3
info:
  title: Logger API
  description: |
    Flexible logging microservice for the **guia.lol** project.
    Services authenticate via JWT and log arbitrary JSON data, each isolated to their own logs.

    **Credentials** live in `config.json` (`service` + `secret`, plus optional `name`, `readonly`,
    `active`). The file is read on every request, so edits apply without a restart. The `service`
    is always taken from the JWT, never from the request body. Tokens never expire. Removing a
    service from `config.json` revokes its tokens.

    **Access levels**
    - any valid token: `/report`, `/errors`
    - *active* service (not `"active": false`): `POST /log`, `POST /error` and their `/batch`
      routes, otherwise 403
    - *admin* credential (`"readonly": true`): every `/admin/*` route, otherwise 403

    **Envelope (since 1.2.0).** Every JSON response is `{success, data}`. Successes are HTTP 200.
    Errors carry the real HTTP status, with `data.message` and `data.code`.

    **Event time (since 1.2.2).** Each entry has a `timestamp` (when the server received it) and an
    `occurredAt` (when it happened). Clients that queue events can send `occurredAt` and `sentAt`
    (ISO-8601 strings, UTC unless they carry an offset). Only the gap between them, the event's
    age, is trusted, so the phone's clock doesn't need to be right:

    | Client sent | `occurredAt` stored |
    |---|---|
    | neither | the arrival time |
    | `occurredAt` only | `occurredAt` as given |
    | `occurredAt` and `sentAt` | `arrival - (sentAt - occurredAt)` |
    | `sentAt` only | the arrival time |

    A negative age counts as 0, and `occurredAt` is never later than the arrival time.
    `from`, `to` and the newest-first order use `occurredAt`; `lastLog` and purges use `timestamp`.
  version: 1.2.2
servers:
  - url: /
    description: This instance
tags:
  - name: Auth
    description: Service authentication
  - name: Logs
    description: Log ingestion and querying (per-service)
  - name: Errors
    description: Error ingestion and querying (per-service)
  - name: Admin
    description: Cross-service access, admin (readonly) credential only
  - name: System
paths:
  /login:
    post:
      tags: [Auth]
      summary: Get a JWT token
      description: |
        Validates `service` + `secret` against `config.json` and returns a non-expiring HS256 JWT
        `{service, readonly, iat}`. `userId` is accepted in place of `service`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, secret]
              properties:
                service:
                  type: string
                  example: my-service
                secret:
                  type: string
                  example: s3cr3t
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /token:
    post:
      tags: [Auth]
      summary: Decode a token
      description: Verifies a token against this instance's key and returns its payload.
      operationId: decodeToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Decoded payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          decoded:
                            type: object
                            example: { service: my-service, readonly: false, iat: 1760000000 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /log:
    post:
      tags: [Logs]
      summary: Ingest a log entry
      description: |
        Stores the request body (minus the reserved keys `environment`, `occurredAt`, `sentAt`) as
        the `data` of a new entry in `logger_logs`. Any JSON object is accepted (an empty body counts
        as `{}`). `service` comes from the JWT. `environment` is stored in its own column and defaults
        to `unknown`. `occurredAt` / `sentAt` set the event time (see the top of this page).
        Requires an active service.
      operationId: createLog
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payload'
            examples:
              plain:
                summary: Event happening now
                value:
                  environment: production
                  event: user.signup
                  email: user@example.com
                  meta:
                    source: web
              queued:
                summary: Event sent later (skew-corrected)
                value:
                  environment: production
                  occurredAt: '2026-10-05T09:12:40Z'
                  sentAt: '2026-10-07T14:03:11Z'
                  event: game_start
      responses:
        '200':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /log/batch:
    post:
      tags: [Logs]
      summary: Ingest up to 100 log entries at once
      description: |
        For clients that queue events (e.g. offline mobile apps). Writes to `logger_logs`.
        `environment` and `sentAt` apply to the whole batch; each entry is a JSON object that may
        carry its own `occurredAt` (see the top of this page); the rest of it is its `data`
        (`{}` is stored as `{}`). Every entry gets the same `timestamp`.

        **All or nothing.** Everything is validated first; any problem is a 400 and nothing is
        stored (the message names the first offending entry, e.g. `entries[3]: must be an object`).
        A body over 256 KB is a 413. If the database fails, nothing is stored and the response
        is a 500. Resend the same batch after a 5xx or a network failure; drop it after a 4xx.
        There is no deduplication: a batch sent twice is stored twice.

        400 cases: the body isn't an object; `entries` is missing, not an array, empty or longer
        than 100; an entry isn't an object, or contains `environment` or `sentAt`; `environment`,
        `sentAt` or an entry's `occurredAt` is invalid. Requires an active service.
      operationId: createLogBatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Batch'
            example:
              environment: production
              sentAt: '2026-10-07T14:03:11Z'
              entries:
                - occurredAt: '2026-10-05T09:12:40Z'
                  event: game_start
                  mode: classic
                - occurredAt: '2026-10-05T09:31:02Z'
                  event: game_over
                  score: 18432
      responses:
        '200':
          $ref: '#/components/responses/BatchStored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
  /report:
    get:
      tags: [Logs]
      summary: Query own logs
      description: |
        The authenticated service's logs, newest first by `occurredAt`, with an optional date range
        (on `occurredAt`) and pagination.
      operationId: getReport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/skip'
      responses:
        '200':
          $ref: '#/components/responses/LogList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /error:
    post:
      tags: [Errors]
      summary: Ingest an error entry
      description: |
        Same as `POST /log`, but stored in `logger_errors`. Requires an active service.
      operationId: createError
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payload'
            example:
              environment: production
              message: "Failed to fetch page"
              stack: "Error: ECONNREFUSED\n    at ..."
              url: "https://example.com/event/123"
      responses:
        '200':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /error/batch:
    post:
      tags: [Errors]
      summary: Ingest up to 100 error entries at once
      description: |
        Same as `POST /log/batch`, but stored in `logger_errors`. Requires an active service.
      operationId: createErrorBatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Batch'
            example:
              environment: production
              sentAt: '2026-10-07T14:03:11Z'
              entries:
                - occurredAt: '2026-10-05T09:20:00Z'
                  message: texture failed to load
                  file: sprites/player.png
      responses:
        '200':
          $ref: '#/components/responses/BatchStored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
  /errors:
    get:
      tags: [Errors]
      summary: Query own errors
      description: |
        The authenticated service's errors, newest first by `occurredAt`, with an optional date range
        (on `occurredAt`) and pagination.
      operationId: getErrors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/skip'
      responses:
        '200':
          $ref: '#/components/responses/ErrorList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/logs:
    get:
      tags: [Admin]
      summary: Query logs across all services
      description: Same as `/report`, cross-service, with an optional `service` filter.
      operationId: adminLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/service'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/skip'
      responses:
        '200':
          $ref: '#/components/responses/LogList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Admin]
      summary: Purge one service's logs
      description: |
        Deletes the `service`'s logs received (`timestamp`) more than `olderThanDays` days ago
        (default 365), then writes an
        audit entry into `logger_logs` under the reserved `service: "logger"`
        (`{action: "purge_logs", targetService, cutoffDays, deletedCount, performedBy}`).
      operationId: adminPurgeLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/purgeService'
        - $ref: '#/components/parameters/olderThanDays'
      responses:
        '200':
          $ref: '#/components/responses/Purged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/errors:
    get:
      tags: [Admin]
      summary: Query errors across all services
      description: Same as `/errors`, cross-service, with an optional `service` filter.
      operationId: adminErrors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/service'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/skip'
      responses:
        '200':
          $ref: '#/components/responses/ErrorList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Admin]
      summary: Purge one service's errors
      description: |
        Same as `DELETE /admin/logs`, on `logger_errors`. The audit entry (`action: "purge_errors"`)
        still goes into `logger_logs`.
      operationId: adminPurgeErrors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/purgeService'
        - $ref: '#/components/parameters/olderThanDays'
      responses:
        '200':
          $ref: '#/components/responses/Purged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/services:
    get:
      tags: [Admin]
      summary: Per-service summary
      description: |
        Every active service in `config.json` (including those with no logs), plus the synthetic
        `{service: "logger", name: "Logger (self)"}` that holds the purge audit trail. Counts and
        `lastLog` (the latest arrival `timestamp`) come from `logger_logs` only. Sorted by `lastLog`, newest first, never-logged last.
      operationId: adminServices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          services:
                            type: array
                            items:
                              type: object
                              properties:
                                service:
                                  type: string
                                  example: my-service
                                name:
                                  type: string
                                  example: My Service
                                count:
                                  type: integer
                                  example: 42
                                lastLog:
                                  type: string
                                  format: date-time
                                  nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /health-check:
    get:
      tags: [System]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is up (`database` is `ok` or `fail`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          health:
                            type: string
                            example: ok
                          database:
                            type: string
                            example: ok
                          time:
                            type: string
                            description: Server time, UTC
                            example: '2026-10-05 22:59:48'
  /version:
    get:
      tags: [System]
      summary: Release version
      operationId: getVersion
      responses:
        '200':
          description: Current version
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - properties:
                      data:
                        type: object
                        properties:
                          version:
                            type: string
                            example: '1.2.2'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Obtain a token via `POST /login`. Tokens never expire.
  parameters:
    from:
      name: from
      in: query
      description: |
        Only entries that occurred (`occurredAt`) at or after this date/time. Any format PHP's
        DateTimeImmutable parses (e.g. `2026-10-01`, `2026-10-01T12:00:00-03:00`); UTC unless an
        offset is given. Entries without a client time have `occurredAt` = `timestamp`.
      schema:
        type: string
    to:
      name: to
      in: query
      description: |
        Only entries that occurred (`occurredAt`) at or before this date/time (same formats as
        `from`). A bare date means its
        midnight, so `to=2026-10-01` excludes the rest of that day.
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Max entries to return (clamped to 1–1000)
      schema:
        type: integer
        default: 100
    skip:
      name: skip
      in: query
      description: Entries to skip (pagination offset, ≥ 0)
      schema:
        type: integer
        default: 0
    service:
      name: service
      in: query
      description: Only this service
      schema:
        type: string
    purgeService:
      name: service
      in: query
      required: true
      description: Service to purge
      schema:
        type: string
    olderThanDays:
      name: olderThanDays
      in: query
      description: Delete entries older than this many days (positive whole number)
      schema:
        type: integer
        minimum: 1
        default: 365
  schemas:
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          description: The route's payload
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          properties:
            message:
              type: string
              example: Invalid credentials
            code:
              type: integer
              example: 401
            type:
              type: string
              description: Vendor field (`exception`, or `unknown error` for an unknown route)
              example: exception
    Payload:
      type: object
      additionalProperties: true
      properties:
        environment:
          type: string
          maxLength: 50
          description: |
            Deployment environment (e.g. production, staging, development). A number is stored as
            its string; an empty string or any other type is a 400.
          default: unknown
          example: production
        occurredAt:
          $ref: '#/components/schemas/ClientDate'
        sentAt:
          $ref: '#/components/schemas/ClientDate'
    ClientDate:
      type: string
      format: date-time
      description: |
        Reserved key, not stored in `data`. ISO-8601 (`2026-10-05T09:12:40Z`,
        `2026-10-05T06:12:40.250-03:00`, `2026-10-05`); UTC when there is no offset. Anything else,
        including `null` or a number, is a 400. `occurredAt` is when the event happened, `sentAt`
        when the client sent the request (both by the client's clock).
      example: '2026-10-05T09:12:40Z'
    Batch:
      type: object
      required: [sentAt, entries]
      properties:
        environment:
          type: string
          maxLength: 50
          default: unknown
          description: Applies to every entry (same rules as the single routes)
          example: production
        sentAt:
          $ref: '#/components/schemas/ClientDate'
        entries:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: true
            description: |
              One entry. May contain `occurredAt`; must not contain `environment` or `sentAt`
              (batch-level only). Everything else is stored as its `data`.
            properties:
              occurredAt:
                $ref: '#/components/schemas/ClientDate'
    Entry:
      type: object
      properties:
        _id:
          type: integer
          example: 42
        service:
          type: string
          example: my-service
        serviceName:
          type: string
          description: The service's `name` from config.json (its id if it has none)
          example: My Service
        environment:
          type: string
          example: production
        data:
          description: The JSON object the service posted, minus `environment`, `occurredAt` and `sentAt`
          example:
            event: user.signup
            email: user@example.com
        timestamp:
          type: string
          format: date-time
          description: When the server received the entry (UTC, ms)
          example: '2026-10-05T22:59:48.123Z'
        occurredAt:
          type: string
          format: date-time
          description: |
            When the event happened (UTC, ms), skew-corrected from the client's `occurredAt` /
            `sentAt`; equal to `timestamp` when the client sent no time. Since 1.2.2.
          example: '2026-10-05T21:10:02.123Z'
  responses:
    Created:
      description: Entry stored
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42
                      timestamp:
                        type: string
                        format: date-time
                        description: Arrival time
    BatchStored:
      description: Every entry stored
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Entries stored (always all of them)
                        example: 2
    TooLarge:
      description: Body larger than 256 KB; nothing stored
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LogList:
      description: Matching logs
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Entries matching the filter (ignoring pagination)
                        example: 250
                      count:
                        type: integer
                        description: Entries in this response
                        example: 100
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/Entry'
    ErrorList:
      description: Matching errors
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 12
                      count:
                        type: integer
                        example: 12
                      errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/Entry'
    Purged:
      description: Purge result
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
                        example: 42
    BadRequest:
      description: Invalid body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token, a token for a service no longer in config.json, or bad credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Inactive service (writes) or not the admin (readonly) credential (`/admin/*`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: |
        Internal error. Unexpected failures (e.g. the database) carry a generic
        `Internal server error` message; the details go to the server log.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
